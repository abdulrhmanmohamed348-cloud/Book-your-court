.top .in{position:relative;max-width:560px;margin:0 auto}
.top h1{margin:0;font-size:clamp(46px,14vw,72px);line-height:1.05}
.top p{margin:8px 0 0;max-width:34ch;color:#cfe3d6}
.price{display:inline-block;margin-top:14px;padding:4px 14px;background:var(--lamp);color:var(--night2);border-radius:999px;font-weight:600;font-size:15px}

.tabs{position:relative;z-index:2;max-width:560px;margin:-26px auto 0;padding:0 16px}
.tabs .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:14px;padding:5px;box-shadow:0 6px 20px rgba(8,28,20,.18)}
.tabs button{border:0;background:transparent;padding:12px;border-radius:10px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--night);color:#fff}

.wrap{max-width:560px;margin:0 auto;padding:0 16px}
section{margin-top:26px}
h2{margin:0 0 10px;font-size:24px;line-height:1.3}
.hint{margin:-4px 0 12px;color:var(--muted);font-size:14px}

.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.day{flex:0 0 auto;min-width:78px;padding:10px 8px;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:var(--r);scroll-snap-align:start}
.day b{display:block;font-weight:600}
.day small{color:var(--muted);font-size:13px}
.day[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:#fff}
.day[aria-pressed="true"] small{color:#b7d3c1}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-card{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:start;padding:14px;background:var(--card);border:2px solid var(--line);border-radius:var(--r)}
.field-card svg{width:52px;height:36px;color:var(--turf);margin-bottom:6px}
.field-card strong{font-family:'Lalezar',sans-serif;font-weight:400;font-size:24px;line-height:1.2}
.field-card span{font-size:14px;color:var(--muted)}
.field-card[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:#fff}
.field-card[aria-pressed="true"] svg{color:var(--lamp)}
.field-card[aria-pressed="true"] span{color:#b7d3c1}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 12px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-inline-end:5px;vertical-align:-1px;border:2px solid var(--line);background:var(--card)}
.legend i.b{background:var(--red-soft);border-color:var(--red)}
.legend i.p{background:var(--grey);border-color:var(--grey-ink)}

.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grp{grid-column:1/-1;margin:10px 0 0;font-family:'Lalezar',sans-serif;font-size:20px;line-height:1.3}
.grp small{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:13px;color:var(--muted);margin-inline-start:8px}
.slot{padding:10px 4px;text-align:center;font-weight:600;background:var(--card);border:2px solid var(--line);border-radius:var(--r);min-height:60px;line-height:1.35}
.slot small{display:block;font-size:12px;font-weight:600;margin-top:2px}
.slot:hover:not(:disabled){border-color:var(--turf)}
.slot[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:#fff}
.slot.booked:disabled{background:var(--red-soft);border-color:var(--red);color:var(--red);cursor:not-allowed}
.slot.past:disabled{background:var(--grey);border-color:transparent;color:var(--grey-ink);cursor:not-allowed}
.skel{min-height:60px;border-radius:var(--r);background:#dbe4dd;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.empty{grid-column:1/-1;padding:16px;background:var(--card);border:2px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}

.durs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dur{padding:12px 6px;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:var(--r)}
.dur b{display:block;font-weight:600}
.dur small{color:var(--muted);font-size:14px}
.dur[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:#fff}
.dur[aria-pressed="true"] small{color:#b7d3c1}
.dur:disabled{background:var(--grey);color:var(--grey-ink);cursor:not-allowed}
.dur:disabled b,.dur:disabled small:not(.why){text-decoration:line-through}
.dur .why{display:block;margin-top:2px;font-size:12px;font-weight:600;color:var(--red)}
.dur-note{margin:10px 0 0;font-size:14px;color:var(--muted)}

label{display:block;font-weight:500;margin-bottom:4px}
.row{margin-bottom:14px}
input[type=text],input[type=tel]{width:100%;height:50px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:var(--r)}
input[aria-invalid="true"]{border-color:var(--red)}
.err{color:var(--red);font-size:14px;margin-top:4px}
.trap{position:absolute;inset-inline-start:-9999px;width:1px;height:1px;opacity:0}

.alert{margin-top:18px;padding:12px 14px;background:var(--red-soft);color:var(--red);border-radius:var(--r);font-weight:500}
.alert.good{background:#dff1e5;color:#17562f}
.alert button{margin-top:8px;padding:8px 14px;border:2px solid currentColor;border-radius:10px;background:transparent;font-weight:600}
.banner{margin-top:22px;padding:12px 14px;background:#fff4cf;border:2px solid var(--lamp);border-radius:var(--r);font-weight:500}
.banner button{margin-top:8px;padding:6px 12px;border:2px solid var(--ink);border-radius:10px;background:transparent;font-weight:600}
.foot{max-width:560px;margin:36px auto 0;padding:0 16px;color:var(--muted);font-size:14px}
.foot a{color:var(--turf)}
.policy{padding:12px 14px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);font-size:14px;color:var(--muted)}
.policy strong{display:block;margin-bottom:4px;color:var(--ink);font-weight:600}
.policy ul{margin:0;padding-inline-start:18px}
.policy li+li{margin-top:2px}
#policyManage{margin-bottom:16px}

.bar{position:fixed;inset-inline:0;bottom:0;background:var(--night2);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.25)}
.bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar .sum b{display:block;font-weight:600}
.bar .sum span{font-size:14px;opacity:.9}
.cta{flex:0 0 auto;padding:12px 20px;background:var(--lamp);color:var(--night2);border:0;border-radius:var(--r);font-family:'Lalezar',sans-serif;font-size:20px;line-height:1.2}
.cta:disabled{opacity:.7;cursor:progress}

.btn{padding:13px;border-radius:var(--r);border:2px solid var(--night);background:transparent;color:var(--night);font-weight:600}
.btn.main{background:var(--night);color:#fff}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger.main{background:var(--red);color:#fff}
.btn:disabled{opacity:.6;cursor:progress}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}

.done,.manage{max-width:560px;margin:26px auto 0;padding:0 16px}
.ticket{background:var(--card);border:2px dashed var(--turf);border-radius:18px;padding:24px 20px;text-align:center}
.ticket .ok{display:inline-block;padding:4px 12px;background:var(--turf);color:#fff;border-radius:999px;font-size:14px;font-weight:600}
.ticket .ok.cancel{background:var(--red)}
.ticket .code{font-family:'Lalezar',sans-serif;font-size:64px;line-height:1.1;color:var(--turf);margin:10px 0 2px}
.ticket .lbl{color:var(--muted);font-size:14px}
.ticket dl{margin:18px 0 0;text-align:start;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.ticket dt{color:var(--muted)}
.ticket dd{margin:0;font-weight:600}

@media (prefers-reduced-motion:reduce){.skel{animation:none}}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="art" aria-hidden="true"></div>
  <div class="in">
    <h1 id="title" dir="ltr" style="text-align:right">Mal3ab El Mat7an</h1>
    <p>اختار اليوم والساعة وابعت اسمك ورقمك، والحجز بيتأكد فورًا.</p>
    <span class="price" id="priceLine" hidden></span>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="الأقسام">
  <div class="seg" role="tablist">
    <button type="button" role="tab" id="tab-book" aria-selected="true">احجز ميعاد</button>
    <button type="button" role="tab" id="tab-manage" aria-selected="false">حجزي</button>
  </div>
</nav>

<main class="wrap" id="main">
  <div class="banner" id="modBanner" hidden></div>

  <section id="s-fields">
    <h2>اختار الملعب</h2>
    <div class="fields" id="fields"></div>
  </section>

  <section>
    <h2>اختار اليوم</h2>
    <div class="days" id="days" role="group" aria-label="الأيام"></div>
  </section>

  <section>
    <h2>اختار الساعة</h2>
    <div class="legend"><span><i></i>متاح</span><span><i class="b"></i>محجوز</span><span><i class="p"></i>عدّى</span></div>
    <div class="slots" id="slots"></div>
  </section>

  <section id="s-dur" hidden>
    <h2>اختار المدة</h2>
    <div class="durs" id="durs"></div>
    <p class="dur-note" id="durNote" aria-live="polite" hidden></p>
  </section>

  <section id="s-info" hidden>
    <h2>اسمك ورقم تليفونك</h2>
    <form id="form" novalidate autocomplete="on">
      <div class="row">
        <label for="name">الاسم</label>
        <input type="text" id="name" name="name" autocomplete="name" maxlength="60">
        <div class="err" id="nameErr"></div>
      </div>
      <div class="row">
        <label for="phone">رقم التليفون</label>
        <input type="tel" id="phone" name="phone" inputmode="numeric" autocomplete="tel" maxlength="18" dir="ltr" style="text-align:right" placeholder="01XXXXXXXXX">
        <div class="err" id="phoneErr"></div>
      </div>
      <input class="trap" type="text" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    </form>
  </section>

  <section id="s-policy" hidden>
    <div class="policy" id="policyBook"></div>
  </section>

  <div class="alert" id="alert" role="alert" hidden></div>
</main>

<section class="manage" id="manage" hidden>
  <h2>إلغاء أو تعديل حجزك</h2>
  <p class="hint">اكتب رقم الحجز الي ظهرلك وقت الحجز ورقم تليفونك.</p>
  <div class="policy" id="policyManage"></div>
  <div class="row" id="restoreRow" hidden>
    <button class="btn" id="restoreBtn" type="button" style="width:100%">استرجاع آخر حجز</button>
  </div>
  <form id="lookForm" novalidate>
    <div class="row">
      <label for="bid">رقم الحجز</label>
      <input type="text" id="bid" inputmode="text" dir="ltr" style="text-align:right" maxlength="30" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <div class="err" id="bidErr"></div>
    </div>
    <div class="row">

    setErr('bid', 'bidErr', ''); setErr('mphone', 'mphoneErr', ''); $('mAlert').hidden = true; clear($('mResult'));
    $('bid').value = id;
    if (!ID_RE.test(id)) { setErr('bid', 'bidErr', id ? 'رقم الحجز مش مكتوب صح. اتأكد منه (حروف إنجليزي وأرقام بس).' : 'اكتب رقم الحجز.'); bad = true; }
    if (!PHONE_RE.test(phone)) { setErr('mphone', 'mphoneErr', PHONE_MSG); bad = true; }
    if (bad) { return; }
    $('mphone').value = phone;
    var btn = $('lookBtn'); btn.disabled = true; btn.textContent = 'بندوّر...';
    post('/club-lookup', { bookingId: id, phone: phone }, 20000).then(function (data) {
      btn.disabled = false; btn.textContent = 'اعرض حجزي';
      if (!data || !data.ok || !data.booking) {
        lk.fails++; if (lk.fails >= 5) { lk.until = Date.now() + 60000; lk.fails = 0; }
        mAlert((data && data.message) || 'مالقيناش حجز بالرقم والتليفون دول. اتأكد منهم.'); return;
      }
      lk.fails = 0;
      state.found = data.booking;
      state.found.bookingId = state.found.bookingId || id;
      state.found.authPhone = phone;
      state.found.phone = state.found.phone || phone;
      store.set(KEYS.last, state.found.bookingId); store.set(KEYS.phone, phone);
      renderFound(false);
    }).catch(function () {
      btn.disabled = false; btn.textContent = 'اعرض حجزي';
      mAlert('مقدرناش نوصل للنظام. اتأكد من النت وجرّب تاني.');
    });
  }
  function renderFound(askCancel) {
    var b = state.found, box = $('mResult'); clear(box);
    if (!b) { return; }
    box.appendChild(ticket(b, 'حجزك'));
    var acts;
    if (b.canEdit === false) {
      acts = el('p', { class: 'hint', text: b.editMessage || 'الحجز ده عدّى أو اتلغى أو مش متاح تعديله، مينفعش يتعدّل.' });
    } else if (askCancel) {
      acts = el('div', null, [
        el('p', { text: 'متأكد إنك عايز تلغي الحجز ده؟', style: 'font-weight:600;margin:16px 0 0' }),
        el('div', { class: 'actions' }, [
          el('button', { type: 'button', class: 'btn danger main', id: 'yesCancel', text: 'أيوه، ألغي', onclick: doCancel }),
          el('button', { type: 'button', class: 'btn', text: 'لا، سيبه', onclick: function () { renderFound(false); } })
        ])
      ]);
    } else {
      acts = el('div', { class: 'actions' }, [
        el('button', { type: 'button', class: 'btn main', text: 'عدّل الميعاد', onclick: startModify }),
        el('button', { type: 'button', class: 'btn danger', text: 'ألغي الحجز', onclick: function () { renderFound(true); } })
      ]);
    }
    box.appendChild(acts);
  }
  function doCancel() {
    if (state.cancelling || !state.found) { return; }
    var b = state.found, btn = $('yesCancel'), phone = authPhone(b);
    var fp = ['cancel', b.bookingId, phone].join('|');
    state.cancelling = true; btn.disabled = true; btn.textContent = 'بنلغي...';
    post('/club-cancel', { requestId: reqIdFor(fp), bookingId: b.bookingId, phone: phone }, 30000).then(function (data) {
      state.cancelling = false; clearReqId(fp);
      if (data && data.ok) {
        if (store.get(KEYS.last) === b.bookingId) { store.del(KEYS.last); }
        refreshRestore();
        var box = $('mResult'); clear(box);
        box.appendChild(ticket(b, 'الحجز اتلغى', true));
        state.found = null; mAlert('الحجز رقم ' + b.bookingId + ' اتلغى والميعاد رجع متاح.', true);
        return;
      }
      renderFound(true); mAlert(failMsg(data, 'مقدرناش نلغي الحجز. جرّب تاني.'));
    }).catch(function () {
      state.cancelling = false;
      renderFound(true);
      mAlert('النت قطع قبل ما نتأكد من الإلغاء. دوّر على حجزك تاني وشوف حالته، ولو لسه موجود تقدر تلغي تاني.');
    });
  }
  function startModify() {
    var b = state.found; if (!b) { return; }
    state.modify = b; state.slot = null;
    if (b.field) { state.fieldId = String(b.field); }
    var bd = durOf(b); if (DUR_LABELS[bd]) { state.dur = bd; }
    hideAlert(); showTab('book', true);
    load(ISO_RE.test(String(b.date)) ? b.date : null, false);
  }

  /* ---------- init ---------- */
  function init() {
    document.title = 'احجز ' + CONFIG.CLUB_NAME;
    wipeLegacy();
    var foot = $('foot');
    if (clubPhone()) {
      foot.appendChild(document.createTextNode('للاستفسار كلّم النادي على '));
      foot.appendChild(el('a', { href: 'tel:' + clubPhone().replace(/[^0-9+]/g, ''), text: clubPhone() }));
      foot.appendChild(document.createTextNode('.'));
    } else {
      foot.appendChild(document.createTextNode('للاستفسار كلّم إدارة النادي مباشرة.'));
      if (window.console && console.warn) { console.warn('CONFIG.CLUB_PHONE فاضي: ضيف رقم النادي عشان يظهر في الصفحة ورسائل الخطأ.'); }
    }
    var n = store.get(KEYS.name), p = store.get(KEYS.phone);
    if (n) { $('name').value = n; }
    if (p) { $('phone').value = p; $('mphone').value = p; }
    renderPolicy($('policyBook')); renderPolicy($('policyManage'));
    refreshRestore();
    $('restoreBtn').addEventListener('click', function () {
      var id = store.get(KEYS.last), ph = store.get(KEYS.phone);
      if (id) { $('bid').value = id; }
      if (ph) { $('mphone').value = ph; }
      setErr('bid', 'bidErr', ''); setErr('mphone', 'mphoneErr', '');
      $('lookBtn').focus();
    });
    $('tab-book').addEventListener('click', function () { showTab('book'); });
    $('tab-manage').addEventListener('click', function () { showTab('manage'); });
    $('cta').addEventListener('click', submit);
    $('form').addEventListener('submit', function (e) { e.preventDefault(); submit(); });
    $('lookForm').addEventListener('submit', lookup);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && !state.loading && !state.submitting && state.date && $('done').hidden && !$('main').hidden) { load(safeDate(), true); }
    });
    setInterval(function () {
      if (state.loading || state.submitting || $('main').hidden) { return; }
      if (state.cairoDay && state.cairoDay !== cairoNow().date) { load(safeDate(), true); return; }
      var code = syncSelection();
      renderFields(); renderSlots(); renderDurs(); renderBar();
      if (code && $('alert').hidden) { showAlert(syncMsg(code)); }
    }, 30000);
    renderSlots();
    load(null, false);
  }
  init();
})();
</script>
</body>
</html>
